server.port=${PORT:8082}

spring.application.name=ecommerce-app

logging.level.root=INFO
logging.level.com.ecommerce=DEBUG

spring.datasource.url=jdbc:h2:file:/tmp/ecommerce_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

jwt.secret=${JWT_SECRET:ShopHubJwtSecret2026@ADCET#Placement$JavaSpringBoot123456789}
jwt.expiration=86400000

# Fix for JavaMailSender error
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=noreply@buyora.com
spring.mail.password=dummy-password-for-render
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
